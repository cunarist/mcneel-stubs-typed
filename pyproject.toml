# To create the Python virtual environment, run `uv sync`.
# Use Ty for type checking.
# `uv` can be installed from the link below:
# https://docs.astral.sh/uv/getting-started/installation/

[tool.uv.workspace]
members = [
    "stubs/Eto",
    "stubs/GH_IO",
    "stubs/GH_Util",
    "stubs/Grasshopper",
    "stubs/Rhino",
]

[tool.uv.sources]
"eto-stubs-typed" = { workspace = true }
"gh-io-stubs-typed" = { workspace = true }
"gh-util-stubs-typed" = { workspace = true }
"grasshopper-stubs-typed" = { workspace = true }
"rhino-stubs-typed" = { workspace = true }

[tool.ruff]
exclude = ["stubs/"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["TC", "BLE", "S603"]

[tool.ty.rules]
all = "error"
invalid-overload = "ignore"

[tool.ty.environment]
extra-paths = [
    "stubs/Eto",
    "stubs/GH_IO",
    "stubs/GH_Util",
    "stubs/Grasshopper",
    "stubs/Rhino",
]

[dependency-groups]
dev = ["ruff>=0.14.6", "ty>=0.0.32"]
